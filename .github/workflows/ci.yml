name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for the workspace. The Worker verifies runs by importing the client's own
      # engine, so the two are installed and checked together or the guarantee is not tested.
      - run: npm ci

      - run: npm run typecheck

      # Before the tests, not after: the server's tests load wrangler.toml, whose assets
      # directory is web/dist, and on a fresh checkout that does not exist until the site is
      # built. Locally it always happens to be there, which is how this went unnoticed.
      - run: npm run build

      # The sound tests read web/public/assets/sounds.qsnd. That works here only because the
      # converted assets are committed rather than generated at build time -- the upstream
      # tree they come from is not vendored. See docs/FIDELITY.md.
      #
      # The server's tests run inside workerd against a local D1 and R2, so this also exercises
      # the migrations.
      - run: npm test

      # The bundle step is what proves the Worker can still link against the engine.
      - run: npm run bundle --workspace quadra-server
