name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The sound tests read web/public/assets/sounds.qsnd. That works here only because the
      # converted assets are committed rather than generated at build time -- the upstream
      # tree they come from is not vendored. See docs/FIDELITY.md.
      - run: npm test
