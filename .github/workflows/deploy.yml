name: Deploy

# Only after CI has passed on main. The Worker verifies every submitted run by importing the
# client's own engine, so shipping a Worker whose tests did not run would mean a leaderboard
# certifying scores with something nobody checked.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # For rolling back, or for shipping a fix when the CI run has already gone green.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A push, not a pull request: CI runs on those too, and `branches: [main]` above matches the
    # branch the run came from, so a fork's PR from a branch it calls `main` would pass that filter
    # and, given the checkout below, have its own code deployed with this repository's secrets.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      # The commit CI passed, not whatever main points at by now: after two quick pushes the first
      # green run would otherwise ship the second commit while its own tests are still going.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The Worker serves this directory, so it has to exist before the Worker is uploaded.
      - run: npm run build

      # Migrations first: a Worker whose code expects a column that is not there yet is a
      # broken deployment, and every migration here is additive.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quadra --remote
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The commit goes on the deployment so `wrangler deployments list` says what is live.
      - name: Deploy the Worker
        run: npx wrangler deploy --message "$(git rev-parse --short HEAD)"
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The health check names the simulation the Worker is running. If this does not answer,
      # the deployment did not take.
      - name: Check it came up
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.PUBLIC_ORIGIN }}/v1/health" | tee /dev/stderr | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 6
          done
          echo "the deployed Worker did not answer /v1/health"
          exit 1
