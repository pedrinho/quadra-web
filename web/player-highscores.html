<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Every run · Quadra</title>
    <meta
      name="description"
      content="Every run played on the Quadra leaderboard, best first. Each one is a recording you can watch."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#121414" />

    <!-- The two faces the first screen is set in. The other weights can wait for the stylesheet.
         crossorigin is required on font preloads even same-origin, or the fetch is made twice. -->
    <link
      rel="preload"
      href="/assets/fonts/SofiaSans-Regular-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/SofiaSansExtraCondensed-Light-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <!-- One of four doors into the same app; see vite.config.ts. The route is where it opens. -->
  <body data-route="runs">
<!--shell-->
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
