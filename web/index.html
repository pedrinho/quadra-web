<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quadra Web</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #14161a; color: #d6d9de;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #2a2f37;
        max-width: 100%;
      }
      .hud { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
      .hud b { color: #fff; font-weight: 600; }
      .keys { color: #767d89; font-size: 12px; text-align: center; max-width: 640px; }
      #status { min-height: 1.5em; color: #e0a45e; }

      /* Settings overlay */
      .settings {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0b0d10cc; padding: 16px; overflow: auto; z-index: 10;
      }
      .settings[hidden] { display: none; }
      .settings .panel {
        width: min(460px, 100%); max-height: 100%; overflow: auto;
        background: #1b1f25; border: 1px solid #333a44; border-radius: 6px; padding: 16px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .settings header { display: flex; align-items: baseline; justify-content: space-between; }
      .settings h2 { margin: 0; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
      .settings h3 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: #767d89;
      }
      .settings .group { display: flex; flex-direction: column; gap: 10px; }
      .settings .field { display: flex; flex-direction: column; gap: 2px; }
      .settings .row { display: flex; align-items: center; gap: 12px; }
      .settings .row label { flex: 1; }
      .settings .readout { color: #767d89; font-size: 11px; }
      .settings input[type='range'] { flex: 1 1 180px; accent-color: #e0a45e; }
      .settings button {
        font: inherit; color: #d6d9de; background: #262b33; border: 1px solid #3a424e;
        border-radius: 4px; padding: 4px 10px; cursor: pointer;
      }
      .settings button:hover { background: #313843; }
      .settings button.key { min-width: 130px; }
      .settings button.arming { border-color: #e0a45e; color: #e0a45e; }
      .settings button.duplicate { border-color: #7a6033; }
      .settings button.close { padding: 2px 8px; }
      .settings .actions { display: flex; gap: 8px; }
      .settings .hint { color: #767d89; font-size: 11px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="640" height="480"></canvas>
    <div class="hud">
      <span>score <b id="score">0</b></span>
      <span>lines <b id="lines">0</b></span>
      <span>level <b id="level">1</b></span>
      <span>best chain <b id="chain">0</b></span>
    </div>
    <div id="status"></div>
    <!-- Filled from the live bindings by main.ts; press Esc to change them. -->
    <div class="keys" id="keys"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
